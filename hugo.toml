# ============================================================
# ZISAI.COM
# Hugo + PaperMod
# ============================================================


# ------------------------------------------------------------
# 基础全局配置
# ------------------------------------------------------------

baseURL = "https://zisai.com/"
title = "紫塞 zisai.com"
theme = "PaperMod"

locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

enableInlineShortcodes = true
enableEmoji = true
enableRobotsTXT = true

buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

googleAnalytics = "G-WQ5LVXCGRZ"


# ------------------------------------------------------------
# 分页配置
# ------------------------------------------------------------

[pagination]
  pagerSize = 10


# ------------------------------------------------------------
# 压缩配置
# ------------------------------------------------------------

[minify]
  disableXML = true


# ------------------------------------------------------------
# 固定链接
# ------------------------------------------------------------

[permalinks]
  post = "/:title/"


# ------------------------------------------------------------
# 首页输出格式
# ------------------------------------------------------------

[outputs]
  home = ["HTML", "RSS", "JSON"]


# ============================================================
# PaperMod / 网站公共参数
# ============================================================

[params]

  # ----------------------------------------------------------
  # 基础信息
  # ----------------------------------------------------------

  env = "production"

  description = "缘起1998年紫塞网，如今继续记录生活、技术、城市记忆与个人思考。"

  keywords = [
    "沈楠",
    "紫塞",
    "ShenNan",
    "zisai",
    "承德",
    "承德旅游",
    "承德生活",
    "避暑山庄",
    "外八庙",
    "小布达拉",
    "二仙居",
    "坝上草原",
    "木兰围场",
    "热河",
    "承德人",
    "承德博客",
    "技术",
    "生活",
    "互联网",
    "Hugo",
    "Go",
    "物哀",
    "幽玄",
    "侘寂"
  ]


  # ----------------------------------------------------------
  # 作者信息
  # ----------------------------------------------------------

  author = "SHENNAN 沈楠"
  authorName = "SHENNAN 沈楠"
  authorEmail = "mythflair@hotmail.com"

  authorImage = "/images/shennan.png"
  authorImageTitle = "SHENNAN 沈楠"
  authorImageWidth = 120
  authorImageHeight = 120


  # ----------------------------------------------------------
  # 默认社交分享图片
  #
  # 用于 Open Graph / Twitter Card / 微信分享等
  # 对应文件：
  # static/images/zisai-share.png
  # ----------------------------------------------------------

  images = ["/images/zisai-share-q88.jpg"]


  # ----------------------------------------------------------
  # PaperMod 外观
  # ----------------------------------------------------------

  defaultTheme = "auto"

  DateFormat = "2006-01-02"


  # ----------------------------------------------------------
  # PaperMod 文章功能
  # ----------------------------------------------------------

  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # 注意：PaperMod 正确参数是 ShowWordCount
  ShowWordCount = true

  ShowLastMod = true

  showtoc = true
  tocopen = true


  # ----------------------------------------------------------
  # 自定义 CSS
  #
  # 如果你现有模板正在使用它，继续保留
  # ----------------------------------------------------------

  customCSS = ["css/custom.css"]


  # ----------------------------------------------------------
  # 评论
  # ----------------------------------------------------------

  comments = true


# ============================================================
# ZISAI 自定义首页参数
# ============================================================

[params.zisai]

  heroTitle1 = "山河有故事"
  heroTitle2 = "生活自有光"

  heroText = "从一座北方小城承德出发，在山河、人与日常之间，记录技术、文化与生活的更多可能。"

  motto = "随笔记录生活"
  mottoURL = "/about/"


# ============================================================
# 网站图标
# ============================================================

[params.assets]

  favicon = "/favicon.ico"

  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"

  apple_touch_icon = "/apple-touch-icon.png"

  theme_color = "#7b167c"

  msapplication_TileColor = "#7b167c"

  # 如果以后制作 Safari 固定标签图标，可开启
  # safari_pinned_tab = "/safari-pinned-tab.svg"


# ============================================================
# 导航菜单
# ============================================================

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "chengde"
  name = "承德"
  url = "/tags/承德/"
  weight = 30

[[menu.main]]
  identifier = "life"
  name = "生活"
  url = "/tags/生活/"
  weight = 40

[[menu.main]]
  identifier = "tech"
  name = "技术"
  url = "/tags/技术/"
  weight = 50

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 60


# ============================================================
# 分类法
# ============================================================

[taxonomies]
  series = "series"
  tag = "tags"


# ============================================================
# Markdown / Goldmark
# ============================================================

[markup]

  [markup.goldmark]

    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      emoji = true


  # ----------------------------------------------------------
  # 代码高亮
  # ----------------------------------------------------------

  [markup.highlight]

    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "darcula"


  # ----------------------------------------------------------
  # 目录 TOC
  # ----------------------------------------------------------

  [markup.tableOfContents]

    startLevel = 2
    endLevel = 6