# ============================================================
# ZISAI.COM
# Hugo + PaperMod
# ============================================================

# ------------------------------------------------------------
# 基础全局配置
# ------------------------------------------------------------

baseURL = "https://zisai.com/"
title = "紫塞"
theme = "PaperMod"

locale = "zh-cn"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableInlineShortcodes = true
enableEmoji = true
enableRobotsTXT = true

buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

googleAnalytics = "G-5L9GMDCNHD"

# ------------------------------------------------------------
# 分页配置
# ------------------------------------------------------------

[pagination]
  pagerSize = 10


# ------------------------------------------------------------
# 压缩配置
# ------------------------------------------------------------

[minify]
  disableXML = true


# ------------------------------------------------------------
# 固定链接
# ------------------------------------------------------------

[permalinks]
  post = "/:title/"


# ------------------------------------------------------------
# 首页输出格式
# ------------------------------------------------------------

[outputs]
  home = ["HTML", "RSS", "JSON"]


# ============================================================
# PaperMod / 网站公共参数
# ============================================================

# ------------------------------------------------------------
# 顶层作者参数（供全站根上下文读取）
# ------------------------------------------------------------
[params]

  # ----------------------------------------------------------
  # 基础信息
  # ----------------------------------------------------------

  env = "production"

  description = "始于1998年紫塞网，如今继续记录生活、技术、城市记忆与个人思考。"

  keywords = [
    "沈楠",
    "紫塞",
    "ZISAI",
    "承德",
    "热河",
    "互联网",
    "技术",
    "生活",
    "零售数字化",
    "Hugo",
    "Go",
    "人工智能"
  ]

  # ----------------------------------------------------------
  # 作者扩展与 Schema.org 结构化数据
  # ----------------------------------------------------------

  author = "沈楠"
  authorName = "沈楠"
  authorEmail = "mythflair@hotmail.com"
  authorImage = "/images/shennan.png"
  authorImageTitle = "SHENNAN 沈楠"
  authorImageWidth = 120
  authorImageHeight = 120

  # Person 全站统一规范实体
  authorCanonicalUrl = "https://zisai.com/about/"
  authorUrl = "https://zisai.com/about/"

  authorJobTitle = "董事、副总裁、CIO"
  authorDescription = "沈楠，紫塞明珠网（zisai.com）创始人，日本樱美林大学信息学硕士，现任承德宽广控股集团董事、副总裁、CIO，长期从事通信网络、互联网、软件工程、企业信息化与零售数字化实践。"
  authorSchemaImage = "/images/shennan-1024-q82.jpg"

  authorSameAs = [
    # github
    "https://github.com/Mythflair",
    # 宽广集团官网高管介绍
    "http://www.ikuanguang.com/archives/220/",
    # 百度百科专属人物词条
    "https://baike.baidu.com/item/%E6%B2%88%E6%A5%A0/49988317"
  ]

  # ----------------------------------------------------------
  # 默认社交分享图片
  # ----------------------------------------------------------

  images = ["/images/zisai-share-q88.jpg"]


  # ----------------------------------------------------------
  # PaperMod 外观
  # ----------------------------------------------------------

  defaultTheme = "auto"

  DateFormat = "2006-01-02"


  # ----------------------------------------------------------
  # PaperMod 文章功能
  # ----------------------------------------------------------

  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # 注意：PaperMod 正确参数是 ShowWordCount
  ShowWordCount = true

  ShowLastMod = true

  showtoc = true
  tocopen = true


  # ----------------------------------------------------------
  # 自定义 CSS
  #
  # 如果你现有模板正在使用它，继续保留
  # ----------------------------------------------------------

  customCSS = ["css/custom.css"]


  # ----------------------------------------------------------
  # 评论
  # ----------------------------------------------------------

  comments = true


# ============================================================
# ZISAI 自定义首页参数
# ============================================================

[params.zisai]

  heroTitle1 = "紫塞歌明月"
  heroTitle2 = "万户庆升平"

  heroText = "从一座北方小城承德出发，在山河、人与日常之间，记录技术、文化与生活的更多可能。"

  motto = "随笔记录生活"
  mottoURL = "/about/"


# ============================================================
# 网站图标
# ============================================================

[params.assets]

  favicon = "/favicon.ico"

  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"

  apple_touch_icon = "/apple-touch-icon.png"

  theme_color = "#7b167c"

  msapplication_TileColor = "#7b167c"

  # 如果以后制作 Safari 固定标签图标，可开启
  # safari_pinned_tab = "/safari-pinned-tab.svg"


# ============================================================
# 导航菜单
# ============================================================

[[languages.zh-cn.menus.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 10

[[languages.zh-cn.menus.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 20

[[languages.zh-cn.menus.main]]
  identifier = "chengde"
  name = "承德"
  url = "/tags/承德/"
  weight = 30

[[languages.zh-cn.menus.main]]
  identifier = "life"
  name = "生活"
  url = "/tags/生活/"
  weight = 40

[[languages.zh-cn.menus.main]]
  identifier = "tech"
  name = "技术"
  url = "/tags/技术/"
  weight = 50

[[languages.zh-cn.menus.main]]
  identifier = "legacy"
  name = "遗址"
  url = "/legacy/"
  weight = 55

[[languages.zh-cn.menus.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 60


# ============================================================
# 分类法
# ============================================================

[taxonomies]
  series = "series"
  tag = "tags"


# ============================================================
# Markdown / Goldmark
# ============================================================

[markup]

  [markup.goldmark]

    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      emoji = true


  # ----------------------------------------------------------
  # 代码高亮
  # ----------------------------------------------------------

  [markup.highlight]

    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "darcula"


  # ----------------------------------------------------------
  # 目录 TOC
  # ----------------------------------------------------------

  [markup.tableOfContents]

    startLevel = 2
    endLevel = 6
