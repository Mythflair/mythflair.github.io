{{- if .IsHome }}
{{- $heroImage := partial "hero-image.html" . -}}
<link rel="preload" href="{{ $heroImage.mobile }}" as="image" media="(max-width: 760px)">
<link rel="preload" href="{{ $heroImage.tablet }}" as="image" media="(min-width: 761px) and (max-width: 1320px)">
<link rel="preload" href="{{ $heroImage.desktop }}" as="image" media="(min-width: 1321px)">
{{- end }}
<link rel="describedby" href="{{ "llms.txt" | absURL }}" type="text/plain">

{{- /* ZISAI PWA */ -}}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="紫塞">

{{ with site.Params.umami }}{{ if and .scriptURL .websiteID }}
<script defer src="{{ .scriptURL }}" data-website-id="{{ .websiteID }}" data-do-not-track="true"></script>
{{ end }}{{ end }}
