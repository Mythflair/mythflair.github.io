<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", {
      scope: "/"
    }).then((registration) => {
      console.log("ZISAI PWA registered:", registration.scope);
    }).catch((error) => {
      console.error("ZISAI PWA registration failed:", error);
    });
  });
}
</script>
{{ if and .IsPage .File }}
<div class="zisai-views"
     data-article-id="{{ .Params.articleId | default (substr (sha256 .File.Path) 0 24) }}"
     hidden>
  阅读 <span id="zisai-view-count">—</span> 次
</div>
<script defer src="/js/zisai-views.js"></script>
{{ end }}
