<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", {
      scope: "/"
    }).then((registration) => {
      console.log("ZISAI PWA registered:", registration.scope);
    }).catch((error) => {
      console.error("ZISAI PWA registration failed:", error);
    });
  });
}
</script>
{{ if and .IsPage .File }}
  {{ $articleId := .Params.articleId | default (substr (sha256 .RelPermalink) 0 24) }}

  <div class="zisai-views"
       data-article-id="{{ $articleId }}"
       hidden>
  <svg xmlns="http://www.w3.org/2000/svg"
       width="16" height="16"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       style="display:inline-block;vertical-align:-2px;">
    <path d="M2.062 12a1 1 0 0 1 0-.512 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .512 10.75 10.75 0 0 1-19.876 0"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
  <span id="zisai-view-count">—</span>
  </div>


  {{ with resources.Get "js/zisai-views.js" }}
    {{ $js := . | fingerprint "sha256" }}
    <script defer src="{{ $js.RelPermalink }}"></script>
  {{ end }}

{{ end }}
