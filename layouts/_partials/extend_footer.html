<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", {
      scope: "/"
    }).then((registration) => {
      console.log("ZISAI PWA registered:", registration.scope);
    }).catch((error) => {
      console.error("ZISAI PWA registration failed:", error);
    });
  });
}
</script>
