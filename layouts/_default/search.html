{{- define "main" }}

<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
    {{- if not (.Param "hideMeta") }}
    <div class="post-meta">
        {{- partial "translation_list.html" . -}}
    </div>
    {{- end }}
</header>

<div id="searchbox">
    <p class="zisai-search-hint" id="searchHint">{{ i18n "zisai_searchHint" }}</p>
    <input aria-describedby="searchHint" id="searchInput" autofocus placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="{{ i18n "zisai_searchArticles" }}" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" aria-label="{{ i18n "zisai_searchResults" }}" aria-live="polite"></ul>
</div>

{{- end }}{{/* end main */}}
