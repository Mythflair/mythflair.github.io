<g fill="#68545f"><path d="M1500 485 h48 v46 h-48zM1494 476 h60 l-8 12h-44z"/><path d="M1715 510 h48 v46 h-48zM1709 501 h60 l-8 12h-44z"/><path d="M1850 468 h46 v44 h-46zM1844 460 h58 l-8 11h-42z"/></g>
<!-- 湖面 -->
<path d="M0 755 C340 705 620 735 940 760 C1290 785 1550 745 1920 770 L1920 1080 0 1080Z" fill="url(#water)"/>
<g opacity=".45" stroke="#fff" stroke-width="3"><path d="M120 830h520M980 855h620M450 930h820M90 1010h1080"/></g>
<!-- 古建亭阁 -->
<g transform="translate(600 640)"><rect x="-90" y="55" width="180" height="80" fill="#9c503d"/><rect x="-110" y="42" width="220" height="18" fill="#472d38"/><path d="M-130 38 Q0 -40 130 38 L100 48 H-100Z" fill="#2f3a45"/><rect x="-52" y="68" width="26" height="67" fill="#e3b66a"/><rect x="26" y="68" width="26" height="67" fill="#e3b66a"/></g>
<g transform="translate(1470 675) scale(.8)"><rect x="-75" y="48" width="150" height="70" fill="#a1513a"/><path d="M-110 40 Q0 -30 110 40 L82 50 H-82Z" fill="#303948"/><rect x="-35" y="58" width="20" height="60" fill="#e0ad62"/><rect x="15" y="58" width="20" height="60" fill="#e0ad62"/></g>
