<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">紫塞山河</title><desc id="desc">以承德山河、磬锤峰、亭阁、长城与水面为意象的淡雅插画。</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8dcff"/><stop offset=".48" stop-color="#ffd7ba"/><stop offset="1" stop-color="#fff2cf"/></linearGradient>
  <linearGradient id="m1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e7da9"/><stop offset="1" stop-color="#b38a91"/></linearGradient>
  <linearGradient id="m2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b6087"/><stop offset="1" stop-color="#8b6c78"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4dfc4"/><stop offset="1" stop-color="#b9bfd2"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fffbe5"/><stop offset="1" stop-color="#ffd6a3" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
<circle cx="1560" cy="270" r="230" fill="url(#sun)"/><circle cx="1600" cy="282" r="34" fill="#fff8d8" opacity=".92"/>
<g opacity=".38" fill="#fff"><ellipse cx="720" cy="325" rx="320" ry="60" filter="url(#blur)"/><ellipse cx="1260" cy="405" rx="370" ry="74" filter="url(#blur)"/></g>
<path d="M0 535 L180 455 330 505 525 410 730 500 900 430 1090 500 1315 390 1500 500 1710 410 1920 520 1920 760 0 760Z" fill="#a89fb5" opacity=".55"/>
<path d="M0 635 L220 510 420 615 610 485 810 615 1010 520 1210 630 1420 500 1620 600 1815 500 1920 560 1920 805 0 805Z" fill="url(#m1)" opacity=".75"/>
<path d="M0 700 L260 590 450 685 700 565 950 700 1210 585 1460 680 1720 570 1920 645 1920 860 0 860Z" fill="url(#m2)" opacity=".9"/>
<!-- 磬锤峰 -->
